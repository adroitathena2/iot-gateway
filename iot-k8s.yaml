apiVersion: apps/v1
kind: Deployment
metadata:
  name: iot-core
  labels:
    service: iot-core
spec:
  replicas: 2
  selector:
    matchLabels:
      service: iot-core
  template:
    metadata:
      labels:
        service: iot-core
    spec:
      containers:
        - name: iot-core
          image: nginx:alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: iot-core-svc
spec:
  type: NodePort
  selector:
    service: iot-core
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30098
